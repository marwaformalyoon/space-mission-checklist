<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Mission Checklist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Space Mission Checklist</h1>
  <p>Track your mission preparation tasks.</p>

  <div id="checklist">
    <p>
      <label>
        <input type="checkbox"> Check communication systems
      </label>
    </p>
    <p>
      <label>
        <input type="checkbox"> Inspect spacesuits
      </label>
    </p>
    <p>
      <label>
        <input type="checkbox"> Prepare food and water supplies
      </label>
    </p>
    <p>
      <label>
        <input type="checkbox"> Review mission objectives
      </label>
    </p>
    <p>
      <label>
        <input type="checkbox"> Complete crew safety briefing
      </label>
    </p>
  </div>
</body>
</html>
